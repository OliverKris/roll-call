name: common-lib

on:
    push:
        branches: [main]
        paths:
            - "backend/libs/common/**"
            - ".github/workflows/common.yml"
    pull_request:
        branches: [main]
        paths:
            - "backend/libs/common/**"
            - ".github/workflows/common.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PYTHON_VERSION: "3.12"

defaults:
    run:
        working-directory: backend/libs/common

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install
              run: |
                  pip install uv
                  uv pip install --system . -r requirements-dev.txt
            - run: ruff check .
            - run: ruff format --check .
            - run: python -m pytest -v
