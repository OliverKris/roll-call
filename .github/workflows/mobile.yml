name: mobile-app

on:
    push:
        branches: [main]
        paths:
            - "apps/mobile/**"
            - ".github/workflows/mobile.yml"
    pull_request:
        branches: [main]
        paths:
            - "apps/mobile/**"
            - ".github/workflows/mobile.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: apps/mobile

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: apps/mobile/package-lock.json
            - run: npm ci
            - name: Type check
              run: npx tsc --noEmit
            - name: Lint
              run: npx expo lint
            - name: Check Expo dependency versions
              run: npx expo-doctor
