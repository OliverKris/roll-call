name: profile-service

on:
    push:
        branches: [main]
        paths:
            - "backend/services/profile/**"
            - "backend/libs/common/**"
            - ".github/workflows/profile.yml"
    pull_request:
        branches: [main]
        paths:
            - "backend/services/profile/**"
            - "backend/libs/common/**"
            - ".github/workflows/profile.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PYTHON_VERSION: "3.12"

defaults:
    run:
        working-directory: backend/services/profile

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - run: pip install ruff==0.17.1
            - run: ruff check .
            - run: ruff format --check .

    unit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  pip install uv
                  uv pip install --system ../../libs/common
                  uv pip install --system -r pyproject.toml -r requirements-dev.txt
            - name: Run unit tests
              run: python -m pytest tests/unit -v --cov=app --cov-report=term-missing

    integration:
        needs: unit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  pip install uv
                  uv pip install --system ../../libs/common
                  uv pip install --system -r pyproject.toml -r requirements-dev.txt
            - name: Run integration tests
              run: python -m pytest -m integration -v

    docker-build:
        needs: unit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: Build image (context is backend/ so libs/common is included)
              run: docker build -f Dockerfile -t profile-service:ci ../..
